name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach a fresh build to
        required: true

permissions:
  contents: write

jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The checkout keeps app.py beside the .app so it stays editable; the released
      # bundle carries it so a downloader gets one thing to drag and nothing to install.
      - name: Stage a self-contained bundle
        run: |
          RES=Bookbind.app/Contents/Resources
          cp app.py "$RES/"
          cp bookbind_cli.py "$RES/"
          cp -R static "$RES/"
          chmod +x Bookbind.app/Contents/MacOS/Bookbind

      - name: Package
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          zip -r -X "dist/Bookbind-${TAG#v}-macos.zip" Bookbind.app

      - name: Check the artifact as a downloader receives it
        run: |
          unzip -q dist/*.zip -d /tmp/out
          test -x /tmp/out/Bookbind.app/Contents/MacOS/Bookbind
          test -f /tmp/out/Bookbind.app/Contents/Resources/app.py
          test -f /tmp/out/Bookbind.app/Contents/Resources/static/index.html
          test -f /tmp/out/Bookbind.app/Contents/Resources/AppIcon.icns
          python3 -c "import ast;ast.parse(open('/tmp/out/Bookbind.app/Contents/Resources/app.py').read())"
          python3 -c "import ast;ast.parse(open('/tmp/out/Bookbind.app/Contents/Resources/bookbind_cli.py').read())"
          # This runner has no lipo, so read the fat header directly. A window binary
          # that is one architecture opens on half the Macs and not on the others.
          python3 - <<'PY'
          import struct
          p = "/tmp/out/Bookbind.app/Contents/MacOS/Bookbind"
          b = open(p, "rb").read(4096)
          assert b[:4] == b"\xca\xfe\xba\xbe", "not a universal binary: " + b[:4].hex()
          n = struct.unpack(">I", b[4:8])[0]
          cpus = {struct.unpack(">I", b[8 + 20 * i:12 + 20 * i])[0] for i in range(n)}
          want = {0x01000007: "x86_64", 0x0100000C: "arm64"}
          got = {want[c] for c in cpus if c in want}
          assert got == {"x86_64", "arm64"}, f"architectures are {got or cpus}"
          print("universal:", sorted(got))
          PY
          find /tmp/out -type f | sort

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cat > /tmp/notes.md <<'EOF'
          ## It answers to the command line now

          The window is still the main thing: one folder, one button, one book. But the
          same engine now answers to a command, which is what you want for a script, a big
          pile, or a folder nobody needs to look at.

              bookbind                       open the window
              bookbind ~/Books/somewhere     open it already looking at that folder
              bookbind --cli FOLDER …        no window: bind it right here, print JSON

          `bookbind --cli` takes the folder and the names — `--author`, `--title`,
          `--year`, `--narrator`, `--cover` — and prints one JSON object when it is done,
          carrying the same checks the window shows you. `--dry-run` says what it would
          do and changes nothing. `--lookup` fills empty boxes from iTunes. `--titles
          "<path>=Opening Credits"` names a chapter, `--keep-originals` leaves the sources
          where they are, and `--restore FOLDER` undoes a bind. stdout is JSON and progress
          goes to stderr, so it pipes straight into `jq`.

          The command is a shorthand for `bookbind_cli.py`, which is in the zip next to
          `app.py` — on the small build, `python3 Bookbind.app/Contents/Resources/bookbind_cli.py`.
          It is the app's own engine and not a reimplementation: same ordering, same
          verification, same untouched originals.

          ## Two hazards it now handles properly

          - **A finished `.m4b` sitting in the folder is a book, not a chapter.** It used to
            be picked up as one more source file, which quietly produced a book with the
            previous book inside it. It is never taken as a source now; adding one by hand
            still works.
          - **Audible `.aa` files are encrypted.** A folder holding them used to merge
            whatever it could and leave them behind without a word — an incomplete book
            that looked finished. It now refuses, names the files, and says they need keys.
            `--ignore-locked` binds the readable rest if you tell it to.

          Nothing else changed. It still copies the audio rather than re-recording it, it
          still checks its own work before touching your originals, and it still never
          deletes anything.

          ## Which build to take

          Three builds of the same app. Take whichever suits the machine.

          **`-macos.zip`** — 2 MB, starts instantly. Needs Python and ffmpeg installed:

              brew install python3 ffmpeg
              python3 -m pip install mutagen

          **`-macos-silicon.zip`** — M-series Macs. **`-macos-intel.zip`** — everything
          older. Both are around 70–100 MB and install nothing: Python and ffmpeg are
          inside them, built for that architecture.

          Either way: unzip, put `Bookbind.app` wherever you like, and double-click it.

          **First launch.** The app is not signed or notarized, so macOS refuses a plain
          double-click. Right-click `Bookbind.app` → **Open** → **Open**. After that it
          launches normally.

          If something is missing, the app names it and prints the command to fix it.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" dist/*.zip --title "Bookbind ${TAG#v}" \
              --notes-file /tmp/notes.md
          fi
          gh release view "$TAG" --json isDraft,tagName,assets

  bundled:
    needs: lightweight
    name: bundled (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each of these sites builds for one architecture only, so the rows cannot
          # share a URL. `want` is checked against the downloaded binaries, because a
          # wrong URL here tends to serve a valid binary rather than 404.
          - runner: macos-15-intel
            arch: intel
            want: x86_64
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease/zip
            ffprobe_url: https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip
          - runner: macos-15
            arch: silicon
            want: arm64
            ffmpeg_url: https://www.osxexperts.net/ffmpeg9arm.zip
            ffprobe_url: https://www.osxexperts.net/ffprobe9arm.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Homebrew's ffmpeg is wired to nineteen dylibs in /opt/homebrew, so shipping it
      # would ship a broken app. evermeet's builds are static — the assertions below are
      # the whole point of this step, not decoration.
      - name: Fetch a static ffmpeg
        run: |
          mkdir -p /tmp/ff /tmp/z1 /tmp/z2
          # The two endpoints differ by one path segment, and the wrong one does not
          # 404 -- it quietly serves ffmpeg again, so the copy below would fail with a
          # confusing "no such file" instead of a bad URL.
          curl -fsSL -o /tmp/ffmpeg.zip  "${{ matrix.ffmpeg_url }}"
          curl -fsSL -o /tmp/ffprobe.zip "${{ matrix.ffprobe_url }}"
          # Unpacked into separate directories so identical filenames cannot collide.
          unzip -qo /tmp/ffmpeg.zip  -d /tmp/z1
          unzip -qo /tmp/ffprobe.zip -d /tmp/z2
          ls -l /tmp/z1 /tmp/z2
          cp "$(find /tmp/z1 -type f -name ffmpeg  -perm -u+x | head -1)" /tmp/ff/ffmpeg
          cp "$(find /tmp/z2 -type f -name ffprobe -perm -u+x | head -1)" /tmp/ff/ffprobe
          chmod +x /tmp/ff/ffmpeg /tmp/ff/ffprobe
          for b in /tmp/ff/ffmpeg /tmp/ff/ffprobe; do
            echo "== $b"
            if ! file "$b" | grep -q "${{ matrix.want }}"; then
              echo "not ${{ matrix.want }}:"; file "$b"; exit 1
            fi
            otool -L "$b" | sed -n '2,4p'
            ! otool -L "$b" | grep -qE '/usr/local/|/opt/homebrew/'
            file "$b"
          done

      # --add-data puts static/ inside the frozen bundle, which is where the server
      # looks for it once app.py is no longer a file on disk.
      - name: Freeze the server and its interpreter
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --upgrade pip pyinstaller mutagen
          /tmp/venv/bin/python -m PyInstaller --onedir --noconfirm --log-level WARN \
            --name BookbindServer --add-data "static:static" app.py
          du -sh dist/BookbindServer

      - name: Stage the bundle
        run: |
          RES=Bookbind.app/Contents/Resources
          mkdir -p "$RES/bin"
          cp -R dist/BookbindServer/. "$RES/bin/"
          cp /tmp/ff/ffmpeg /tmp/ff/ffprobe "$RES/bin/"
          chmod +x "$RES/bin/ffmpeg" "$RES/bin/ffprobe" Bookbind.app/Contents/MacOS/Bookbind
          file "$RES/bin/BookbindServer"
          lipo -archs Bookbind.app/Contents/MacOS/Bookbind
          du -sh Bookbind.app

      - name: Package
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p out
          zip -r -X "out/Bookbind-${TAG#v}-macos-${{ matrix.arch }}.zip" Bookbind.app

      # The only check that matters: run the thing a downloader ends up with, on a PATH
      # that has no Homebrew in it, and make it merge a real book.
      - name: Run the extracted app with nothing installed
        run: |
          unzip -q out/*.zip -d /tmp/out
          APP=/tmp/out/Bookbind.app
          RES="$APP/Contents/Resources"
          test -x "$APP/Contents/MacOS/Bookbind"
          test -x "$RES/bin/BookbindServer"
          test -x "$RES/bin/ffmpeg"
          test -f "$RES/bin/_internal/static/index.html"
          test -f "/tmp/out/Bookbind.app/Contents/Resources/AppIcon.icns"
          # The window itself must know both architectures, or the copy in the zip
          # opens on one kind of Mac and refuses on the other.
          lipo -archs "$APP/Contents/MacOS/Bookbind" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/Bookbind" | grep -q x86_64
          ! otool -L "$APP/Contents/MacOS/Bookbind" | grep -qE '/usr/local/|/opt/homebrew/'
          file "$RES/bin/BookbindServer" "$RES/bin/ffmpeg" | grep -c "${{ matrix.want }}" \
            | grep -q '^2$' || { file "$RES/bin/BookbindServer" "$RES/bin/ffmpeg"; exit 1; }

          mkdir -p /tmp/fix
          for i in 1 2 3; do
            "$RES/bin/ffmpeg" -v error -y -f lavfi -i "sine=frequency=$((300*i)):duration=3" \
              -c:a libmp3lame -b:a 96k -metadata track="$i" -metadata artist="CI" /tmp/fix/0$i.mp3
          done

          env -i PATH="$RES/bin:/usr/bin:/bin" HOME="$HOME" "$RES/bin/BookbindServer" \
            >/tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null --max-time 1 http://127.0.0.1:8765/api/home && break
            sleep 0.5
          done
          curl -s http://127.0.0.1:8765/ | grep -q "Made by Morad"

          curl -s -X POST http://127.0.0.1:8765/api/start -H 'Content-Type: application/json' \
            -d '{"folder":"/tmp/fix","author":"CI","title":"Smoke Test","year":"2026","bitrate":""}' \
            >/tmp/start.json
          ID=$(python3 -c "import json;print(json.load(open('/tmp/start.json'))['job']['id'])")
          for i in $(seq 1 90); do
            STATE=$(curl -s http://127.0.0.1:8765/api/jobs | python3 -c "
          import json,sys
          j=[x for x in json.load(sys.stdin)['jobs'] if x['id']=='$ID'][0]
          print(j['state']); [print('  ',c['name'],c['ok'],c['detail'],file=sys.stderr) for c in j['checks']]")
            echo "state: $STATE"
            case "$STATE" in done|failed|cancelled) break;; esac
            sleep 1
          done
          test "$STATE" = done
          ls -l /tmp/fix
          kill %1

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" out/*.zip --clobber
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name) \(.size)"'
